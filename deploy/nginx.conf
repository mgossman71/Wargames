server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Slightly larger uploads aren't needed, but keep the default.
    client_max_body_size 10m;

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip text-based assets
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite's hashed build assets — immutable, cache for a year.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Public assets (Blue Marble imagery, audio, fonts, textures, etc.)
    location ~* \.(?:jpg|jpeg|png|gif|svg|webp|ico|woff2?|ttf|mp3|wav|ogg|mp4)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA fallback — any other path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}